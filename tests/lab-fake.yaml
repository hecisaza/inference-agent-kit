# Self-test lab: the command backend on the local machine against tests/fake_server.py (no hardware, no ssh).
# live and a: port 18611. b: port 18612, so the self-test can check that b is stopped when live is restored.
# bad: answers wrongly, so the self-test can check that a failing suite fails the run.
hosts:
  here: { local: true, platform: generic }
  there: { address: 127.0.0.1, platform: generic }   # never reached: only --dry commands name it
build_host: here

live:
  backend: command
  host: here
  cwd: /tmp
  start: "nohup python3 $KIT/tests/fake_server.py 18611 > /tmp/fake-live.log 2>&1 &"
  stop: "pkill -f 'fake_server.py 18611' || true"
  stop_wait_s: 1
  api: http://127.0.0.1:18611/v1
  model: fake-model

targets:
  a:
    inherit: live
    chunk: 8
  b:
    inherit: a
    start: "nohup python3 $KIT/tests/fake_server.py 18612 > /tmp/fake-b.log 2>&1 &"
    stop: "pkill -f 'fake_server.py 18612' || true"
    api: http://127.0.0.1:18612/v1
  bad:
    inherit: b
    start: "nohup python3 $KIT/tests/fake_server.py 18612 --wrong > /tmp/fake-bad.log 2>&1 &"
  img:   # a recipe-docker target for the self-test's --dry build and ship (nothing is built; the plan is printed)
    backend: recipe-docker
    head: here
    recipe_dir: /tmp/nowhere
    start: ./start.sh
    image: fake:img
    build: { recipe_checkout: /tmp/nowhere, command: ./build.sh }
    api: http://127.0.0.1:18613/v1
    model: fake-model
